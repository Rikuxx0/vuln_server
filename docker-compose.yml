services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    ports:
      - "3000:3000"
    restart: unless-stopped

  vuln-api:
    build: ./api
    container_name: vuln-api
    ports:
      - "5050:5000"
    environment:
      - FLASK_ENV=development
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:14
    container_name: poc-postgres
    environment:
      POSTGRES_USER: pocuser
      POSTGRES_PASSWORD: pocpass
      POSTGRES_DB: pocdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: poc-redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    container_name: poc-adminer
    ports:
      - "8080:8080"

volumes:
  pgdata:
